[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-agent-demo"
version = "0.1.0"
description = "Engineering-oriented courier agent demo with FastAPI, PydanticAI, and SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.122.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.6.0",
  "pydantic-ai>=0.0.49",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
courier-agent-demo = "courier_agent_demo.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
